name: workflow.yml
on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_USER: ${{ secrets.BOOKING_DB_USER }}
          MYSQL_PASSWORD: ${{ secrets.BOOKING_DB_PASS }}
          MYSQL_ROOT_PASSWORD: ${{ secrets.BOOKING_DB_ROOT_PASS }}
          MYSQL_DATABASE: Booking-service
        ports:
          - 3306:3307
        options: --health-cmd="mysqladmin ping -h localhost" --health-interval=10s --health-timeout=5s --health-retries=3
    steps:
      #Check out code
      - name: checkout code
        uses: actions/checkout@v5
      # Run environment
      - name: set up java 17
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: "temurin"
          cache: "maven"
      # Run tests
      - name: Run tests
        env:
          SPRING_DATASOURCE_URL: ${{ secrets.BOOKING_TEST_DB_URL }}
          SPRING_DATASOURCE_USERNAME: ${{ secrets.BOOKING_DB_USER }}
          SPRING_DATASOURCE_PASSWORD: ${{ secrets.BOOKING_DB_PASS }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: mvn -B test
      # Build application
      - name: Build application
        env:
          SPRING_DATASOURCE_URL: ${{ secrets.BOOKING_DB_URL }}
          SPRING_DATASOURCE_USERNAME: ${{ secrets.BOOKING_DB_USER }}
          SPRING_DATASOURCE_PASSWORD: ${{ secrets.BOOKING_DB_PASS }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: mvn -B package -DskipTests